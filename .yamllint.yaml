extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false
ignore:
  - docs/public/
  - config/crd/
  - config/rbac/
  - config/webhook/
